<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" width="1024" height="500" role="img" aria-label="Slot Panic">
  <!-- La imagen destacada de la ficha de Google Play (APP.md §6.4), 1024×500.
       El dibujo de favicon.svg en grande —la horquilla con sus dos carriles y
       los dos coches— y el nombre, que no se traduce: una sola imagen vale para
       las fichas en todos los idiomas. Los colores del juego. De aquí sale
       store/feature.png (generate.sh); el PNG no se versiona. -->
  <rect width="1024" height="500" fill="#12141a"/>

  <!-- El icono a escala 12, a la izquierda, con su fondo redondeado. -->
  <clipPath id="icono"><rect x="58" y="58" width="384" height="384" rx="48"/></clipPath>
  <g clip-path="url(#icono)">
    <g transform="translate(58 58) scale(12)">
      <rect width="32" height="32" fill="#1b1e26"/>
      <path d="M7 28V12a5.5 5.5 0 0 1 11 0v8a3.5 3.5 0 0 0 7 0V4" fill="none" stroke="#2c313f" stroke-width="11"/>
      <path d="M7 28V12a5.5 5.5 0 0 1 11 0v8a3.5 3.5 0 0 0 7 0V4" fill="none" stroke="#aab1c0" stroke-width="6.5"/>
      <path d="M7 28V12a5.5 5.5 0 0 1 11 0v8a3.5 3.5 0 0 0 7 0V4" fill="none" stroke="#2c313f" stroke-width="4.5"/>
      <rect x="2.6" y="16" width="3" height="6" rx="0.8" fill="#e05a63"/>
      <rect x="8.4" y="20" width="3" height="6" rx="0.8" fill="#88aede"/>
    </g>
  </g>

  <text x="510" y="250" font-family="system-ui, 'Segoe UI', Roboto, sans-serif" font-size="104" font-weight="800" letter-spacing="4" fill="#e6e8ee">SLOT</text>
  <text x="510" y="362" font-family="system-ui, 'Segoe UI', Roboto, sans-serif" font-size="104" font-weight="800" letter-spacing="4" fill="#e05a63">PANIC</text>
  <rect x="514" y="392" width="72" height="8" rx="4" fill="#e05a63"/>
  <rect x="598" y="392" width="72" height="8" rx="4" fill="#88aede"/>
</svg>
